[project]
name = "mcp-cam"
version = "1.0.0"
description = "Local MCP server for OpenCode — camera access via OpenCV"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0,<2",
    "opencv-python",
]

[project.scripts]
mcp-cam = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
