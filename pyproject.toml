[project]
name = "mcp-cam"
version = "1.1.11"
description = "Local MCP server for OpenCode — camera access via OpenCV"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.9",
    "cv2-enumerate-cameras",
]

[project.scripts]
mcp-cam = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
